name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `26-08`: the wrapper jar (`gradle/wrapper/gradle-wrapper.jar`) is a committed binary that
      # every step below executes via `./gradlew` — this validates its checksum against Gradle's
      # own published list before anything runs it, the same supply-chain care `ago-console`
      # applies by pinning its Trivy image to a digest rather than a floating tag. Runs right after
      # checkout, before `actions/setup-java` or any `./gradlew` invocation, which is the property
      # the backlog item's own Done-when asks for.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Temurin because that is what `docs/architecture.md`'s stack table and this machine's own
      # toolchain use; the major version (17) is pinned here rather than left as "latest", same as
      # `gradle/libs.versions.toml`'s `jdk` entry pins it once for every module's own
      # `jvmToolchain(...)` call. `cache: gradle` turns on the setup-java action's own wrapper
      # around `actions/cache` for `~/.gradle/caches` and `~/.gradle/wrapper`, keyed on the wrapper
      # properties and every `*.gradle*`/`libs.versions.toml` file - the same purpose
      # `ago-console`'s explicit `actions/cache` step serves for its own Playwright browser.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The format gate, run before anything else builds - the same reason `ago-chat`'s and
      # `ago-console`'s own CI put `dotnet format --verify-no-changes` / `npm run lint` ahead of
      # their build step: a formatting-only branch should cost seconds, not a full compile.
      # `ktlintCheck` is registered by the ktlint Gradle plugin this item adds (`gradle/libs.versions.toml`,
      # `ktlintGradle`) in each of the three modules; invoked from the root it runs in all of them.
      - name: Format check (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      # Android Lint ships with the Android Gradle Plugin already applied to `:app` and
      # `:core:network` - no new dependency, unlike detekt. `docs/backlog/26-08-*.md`'s own Scope
      # states why detekt is deliberately not here: Android Lint plus `26-07`'s
      # `allWarningsAsErrors` already cover this project's actual needs, and detekt would only add
      # a complexity-and-code-smell opinion nobody has asked for yet, plus a second suppression
      # vocabulary to maintain (`ago-root/CLAUDE.md`'s rule that a new dependency must say what it
      # replaces and why hand-rolling - or, here, not adding a tool at all - is worse).
      - name: Android Lint
        run: ./gradlew lint --no-daemon

      # `:core:domain` (plain JVM unit tests), `:core:network` (no tests yet - `NO-SOURCE`, wired
      # the moment `26-12`/`26-13` add its Ktor/SignalR contract tests) and `:app` (no tests yet -
      # `26-20`'s own Compose UI tests) all register a `test` task; invoked from the root, Gradle
      # runs it in every module that has one.
      - name: Test
        run: ./gradlew test --no-daemon

      # A repository that compiles its libraries but cannot assemble an app is green about the
      # wrong thing - this item's own Scope. `assembleDebug` only: no publishing, no signing
      # (`26-09`), the app is built and thrown away.
      - name: Assemble debug build
        run: ./gradlew assembleDebug --no-daemon

      # `if: always()` is what makes a red run diagnosable - `0-04` established this with `.trx` in
      # the backend repositories, and `ago-console` keeps the same shape for its own UX-gate
      # screenshots. Globs rather than one module's path: `:core:network` and `:app` have no test
      # output today, but the pattern already covers them the day `26-12`/`26-20` add one, with
      # nothing to remember to change here.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/test-results/
            **/build/reports/tests/
          if-no-files-found: warn

  # `26-20`: the navigation contract's own Compose UI tests — `26-16`'s back-button-contract suite
  # (`BackContract*Test`, `:app/src/androidTest/.../shell` and `.../ui/components`) plus this item's
  # own `AssignmentNeverNavigatesTest` — running against a real, rendered emulator rather than
  # Robolectric's approximation of one (`docs/architecture.md` §Testing has the full reasoning and
  # what an emulator still cannot catch). A separate job, not a step added to `build-test` above: an
  # emulator boot is a fixed few minutes no source change ever shrinks, and `0-04`'s own gate in
  # `ago-root` (`docs/backlog/0-04-*.md`) is "the slow part goes in its own job rather than lengthening
  # every push" - this job has no `needs:` on `build-test`, so both run concurrently and a push's
  # critical path is whichever one is slower, not their sum.
  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `reactivecircus/android-emulator-runner`'s own documented recipe for GitHub-hosted `ubuntu-latest`
      # runners: `/dev/kvm` exists on the image but is not always group-writable by the runner user out
      # of the box, so this udev rule is what actually turns on the hardware acceleration the brief's
      # own "`ubuntu-latest` has supported KVM since 2023" claim depends on - without it the emulator
      # still boots, only through slow software (TCG) emulation, which is the single most common cause
      # of this action timing out in other projects' CI.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 matches `app/build.gradle.kts`'s own `targetSdk` - the platform behaviour this app is
      # actually written against - rather than `compileSdk` (37, a ceiling on what the code may *name*,
      # not a claim about which OS version it runs well on). `google_apis`/`x86_64`: the `default`
      # target has no x86_64 system image for API levels this recent, and x86_64 is what actually gets
      # hardware acceleration from the KVM step above (`arch`'s own default, `x86`, would run under
      # emulation even with KVM enabled). `disable-animations: true` - listed explicitly rather than
      # left to the action's own identical default - is what keeps a flaky `IdlingResource` timeout
      # from ever being about a transition animation rather than this app's own logic.
      # `26-35` excluded the five `BackContract*Test` files here (not deleted) after two consecutive
      # real CI runs of the identical commit (`26-33`, only its base moved between them) disagreed -
      # one passed clean, the next failed 7 of these same tests, every failure a
      # `ComposeTimeoutException` that exhausted its *entire* 12-second poll budget rather than
      # narrowly missing it. That shape was the system back-key event occasionally never reaching the
      # app's accessibility-event stream at all on this runner's emulator - `UiDevice.pressBack()`
      # dispatching a real system input event through UiAutomator's accessibility pipeline, exactly
      # what a headless CI emulator is least reliable at. `26-36` removed that pipeline from four of
      # the five files - back-press there is now driven straight through the Activity's own
      # `onBackPressedDispatcher`, in-process and synchronous, with nothing left for emulator flakiness
      # to touch. `BackContractSheetDismissTest` alone still presses a real key
      # (`SystemBackPress.kt`'s own `pressBackOnFocusedWindow`, via `Instrumentation.sendKeyDownUpSync`,
      # never `UiAutomator`) because it proves which *window* - the Activity's or a Material3
      # `ModalBottomSheet`'s own platform `Dialog` - a back signal reaches first, which the Activity's
      # dispatcher alone cannot answer (`docs/backlog/26-36-*.md`). That's a narrower, real signal on
      # a single key event, not the accessibility-pipeline dependency that was actually unreliable, so
      # the exclusion comes off and all five files run in the normal gate again.
      - name: Run navigation-contract Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      # `26-25`: this step already existed (`26-20`) but had a bare, fixed artifact name -
      # `actions/upload-artifact@v4+` refuses to create a second artifact with a name that already
      # exists *within the same run*, and this exact job has been re-run by hand
      # (`gh run rerun --failed`) at least three times this session chasing the flake `26-25` fixes -
      # every one of those reruns would have failed this upload step on the second attempt, for a
      # reason with nothing to do with the tests themselves. `run_id`-`run_attempt` is unique per
      # attempt of a run, unlike `github.sha` (identical across every rerun of the same push) - it is
      # what makes a failing run's own report recoverable no matter how many times it gets re-run,
      # which is the whole reason this item's own `docs/backlog/26-25-*.md` names this upload as a
      # Done-when in the first place.
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn

  # `26-09`: the latest `main` reachable from a phone browser and installable, with no build
  # machine and no GitHub login — the reason this job publishes a GitHub Release rather than only
  # the workflow artifact below (`docs/backlog/26-09-*.md`'s own "Why a Release" section: an
  # Actions artifact is a login-gated `.zip` a phone cannot install from; a Release asset has a
  # direct public URL Android will offer to install). Same gate as `ago-console`'s own
  # `publish-images` job, copied rather than re-derived: only a push to `main`, never a pull
  # request, so a fork or a draft branch can never put an installable build where a tester might
  # reach for it.
  publish-apk:
    # `26-26`: `instrumented-tests` used to have no downstream dependent at all, so a release could
    # publish while the back-button contract (or any other UI test) was red, as long as `build-test`
    # alone stayed green. Waiting on both means `publish-apk` starts only once whichever of the two
    # is slower finishes, not just `build-test` — a slower release on every push, in exchange for a
    # release that can never carry a known-broken navigation contract.
    needs: [build-test, instrumented-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release create` against this repository's own GITHUB_TOKEN — no new
      # secret, the same property `adr/0018` and `publish-images` already rely on for their own
      # registries.
    steps:
      # `26-26`: `actions/checkout@v7`'s own default (`fetch-depth: 1`, `fetch-tags: false`) fetches
      # a single commit and no tags at all — confirmed against this job's real published releases
      # (`git tag -l` inside a default checkout finds nothing, even the `release-*`/`debug-*` tags
      # that already exist on this repository). The changelog below needs both: every earlier `v*`
      # tag, to find the most recent one that is not the tag about to be (re)created, and full commit
      # history back to it (or, on the very first release, back to the root commit). `fetch-depth: 0`
      # is what the action's own docs describe as fetching "all history for all branches and tags" —
      # one flag covers both needs, so `fetch-tags: true` (which only adds tags to an otherwise-shallow
      # clone) is not needed on top of it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Four outputs, all computed here so no later step re-derives one its own way:
      #
      #   `short_sha` — not the full 40 hex, because this is the build-metadata half of what
      #   `versionName` shows on the phone (Settings → О приложении, `26-17`) and what the release
      #   notes use, so it needs to be read without a person truncating it by eye.
      #
      #   `release_version` — `26-24`'s hand-bumped semver, read straight out of
      #   `app/build.gradle.kts` rather than repeated here: that file is the single place it is
      #   declared, and a second copy in this workflow would be a second thing to remember to bump.
      #   `test -n` is what turns a renamed or reformatted declaration into a loud failure here
      #   instead of an empty string quietly producing `AGO_Chat_v.apk` further down.
      #
      #   `apk` — the release APK's real path, which `app/build.gradle.kts`'s own
      #   `androidComponents.onVariants` block names for the product rather than leaving at AGP's
      #   default `app-release.apk`. Derived once so the check, upload and release steps below all
      #   read the same value and the path cannot drift between them as the version moves.
      #
      #   `tag` — `26-26`: the release tag/title now name the version (`v<semver>`) rather than the
      #   commit, and three later steps (the changelog's own "which tag is this replacing" search,
      #   the delete-existing-release check, and `gh release create` itself) all need the identical
      #   string — computed once here for the same reason `apk` is, not because any one of those
      #   steps needs it more than the others.
      - name: Compute version inputs
        id: version
        run: |
          set -euo pipefail
          release_version="$(sed -n 's/^val agoReleaseVersion = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          test -n "$release_version"
          {
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "release_version=$release_version"
            echo "apk=app/build/outputs/apk/release/AGO_Chat_v$release_version.apk"
            echo "tag=v$release_version"
          } >> "$GITHUB_OUTPUT"

      # `25-215`: the keystore reaches the runner only as a base64 repository secret — decoded here
      # to `$RUNNER_TEMP`, a directory Actions creates per-job and outside the repository checkout,
      # so it can never land in a commit, an uploaded artifact, or anything this job's own working
      # directory touches. Nothing about the keystore's bytes or the password below is echoed;
      # `env:` is what lets Actions' own by-name log redaction do its job, rather than a value
      # interpolated straight into the shell script.
      - name: Decode signing keystore
        env:
          AGO_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$AGO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ago-android-release.keystore"

      # Rebuilt here rather than passed down from `build-test`: that job already proved the app
      # compiles (`26-08`'s own gate), unversioned and unsigned. Passing the APK between jobs
      # would save a rebuild at the cost of an upload/download step and a second place the build
      # inputs could drift from what `build-test` actually exercised — not a trade worth making at
      # two jobs. `-PagoVersionName`/`-PagoVersionCode` are the Gradle properties
      # `app/build.gradle.kts` reads. `-PagoVersionName` is still the bare short sha and nothing
      # else: since `26-24` the build file composes `versionName` itself as
      # `<hand-set semver>+<this property>`, so the commit provenance `adr/0051` asks for is
      # supplied from here while the product version stays declared in one place, in the repository,
      # rather than being passed in by whatever happens to invoke Gradle. `25-215`:
      # `assembleRelease`, not `assembleDebug` — a stable,
      # persistent-key fingerprint is only useful on the build type RuStore and any future
      # distribution actually cares about — plus the four `agoSigning*` properties that make
      # `app/build.gradle.kts`'s `signingConfigs` guard apply the shared keystore instead of leaving
      # `release` genuinely unsigned. The alias is a plain literal, not a secret (`docs/backlog/25-215-*.md`).
      # `agoSigningKeyPassword` reuses the identical store-password secret - the keystore was
      # generated with one password serving both roles, and the first real run of this job found
      # the cost of forgetting this line the hard way: with no key password supplied, AGP's
      # `validateSigningRelease` reported "Keystore file not set for signing config ago" - a
      # misleading message for what was actually a missing key password, confirmed by a temporary
      # diagnostic println that proved the keystore file itself was present and readable.
      - name: Assemble release APK
        env:
          AGO_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PagoVersionName=${{ steps.version.outputs.short_sha }} \
            -PagoVersionCode=${{ github.run_number }} \
            -PagoSigningKeystorePath="$RUNNER_TEMP/ago-android-release.keystore" \
            -PagoSigningStorePassword="$AGO_SIGNING_STORE_PASSWORD" \
            -PagoSigningKeyPassword="$AGO_SIGNING_STORE_PASSWORD" \
            -PagoSigningKeyAlias=ago-android

      # `docs/backlog/26-09-*.md`'s own Scope: "a step that reads the commit back out of the built
      # APK ... and fails if it does not match `github.sha`". This is `publish-images`'s "Check
      # the image can name its own commit" step (ago-console), the same shape ported from a served
      # `version.json` to `aapt2 dump badging`'s `versionName` field — the APK has no HTTP
      # endpoint to ask, so the commit has to be read back out of the artifact itself. GitHub's
      # `ubuntu-latest` image ships the Android SDK preinstalled — the same thing that already lets
      # `build-test`'s `assembleDebug` run with no `setup-android` step — so this finds whichever
      # build-tools version that image carries rather than pinning one nothing else in this
      # repository depends on.
      #
      # `26-24` did not weaken what this proves: the assertion is still that the APK's own manifest
      # names the exact commit this job built it from. It matches a *substring* now only because
      # `versionName` is `<semver>+<short sha>` rather than the short sha alone — the anchors are
      # what keep that honest. `\+` pins the sha to the build-metadata slot (so a sha could never be
      # matched out of the version number itself), and the closing `'` pins it to the end of the
      # field (so a truncated or prefixed sha cannot pass). The unversioned local-build fallback,
      # `<semver>+dev`, cannot match this by construction.
      - name: Check the APK can name its own commit
        run: |
          set -euo pipefail
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          apk="${{ steps.version.outputs.apk }}"
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | grep -E "versionCode|versionName"
          echo "$badging" | grep -qE "versionName='[^']*\+${{ steps.version.outputs.short_sha }}'"

      # The login-gated fallback `docs/backlog/26-09-*.md`'s "Why a Release" section names for a
      # reviewer who already has a GitHub session — the same role `0-04` gave the `.nupkg` upload
      # it kept beside the real feed. The artifact's own *name* keeps naming the commit rather than
      # the version: it identifies which CI run produced this zip, which is a different question
      # from which product version is inside it, and several runs of one version would otherwise
      # collide on a single name. The APK within it carries the product name (`26-24`).
      - name: Upload release APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ steps.version.outputs.short_sha }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error

      # `26-26`: the changelog is cumulative across every rebuild of one hand-set version rather than
      # resetting on each push under the same version — so the range runs from the most recent *other*
      # `v*` tag to `HEAD`, never "since the last time this job ran". `--sort=-creatordate` orders
      # existing version tags newest-first; the loop takes the first one that is not the tag this run
      # is about to (re)create, so a same-version rebuild still diffs against the *previous distinct*
      # version, not against the tag it is itself replacing a moment later. There is never more than
      # one tag to skip, because `agoReleaseVersion` only ever moves forward by hand (`26-24`).
      #
      # The very first release under this scheme has no earlier `v*` tag at all — true of this
      # repository today (`git tag -l 'v*'` finds nothing yet, only the `release-*`/`debug-*` tags
      # this item retires) — so `range` falls back to plain `HEAD`, and `git log HEAD` means "every
      # commit reachable from HEAD", i.e. this project's entire history to date. That is a deliberate
      # choice, not an oversight: at 38 commits today it reads as a complete, reasonable "what's in
      # this build" list rather than something that needs truncating.
      #
      # `--format=%s` takes only the subject line, on the same reasoning `docs/backlog/26-26-*.md`
      # gives: this project's commits already write a real sentence as the subject (e.g. `feat(26-24):
      # hand-set semver and a product-named release APK`), so a second "body" line would just repeat
      # it. No merge commit can ever land in this range to produce a blank or malformed line —
      # `docs/conventions/git-workflow.md`'s rebase-and-merge convention means `main` never gets one
      # (verified against this repository's own history: `git log --merges` is empty over all 38
      # commits), so there is no placeholder-subject case to guard against here.
      - name: Build changelog
        id: changelog
        run: |
          set -euo pipefail
          previous_tag=""
          for candidate in $(git tag -l 'v*' --sort=-creatordate); do
            if [ "$candidate" != "${{ steps.version.outputs.tag }}" ]; then
              previous_tag="$candidate"
              break
            fi
          done
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..HEAD"
          else
            range="HEAD"
          fi
          git log "$range" --format='- [x] %s' > changelog.md

      # Written to a file rather than inlined into `gh release create --notes`: multi-paragraph
      # Markdown with backticks survives a heredoc far more reliably than a quoted `--notes`
      # argument. `26-26` dropped the install-instructions paragraph `docs/backlog/26-09-*.md`
      # originally asked for here — the author decided it no longer earns its place — and replaced
      # it with the changelog built above; `$(cat changelog.md)` inside this same heredoc is what
      # splices that file's checkbox lines in without a second file write.
      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          ## Changelog

          $(cat changelog.md)

          Version \`${{ steps.version.outputs.release_version }}\`, built from commit \`${{ github.sha }}\` — versionName \`${{ steps.version.outputs.release_version }}+${{ steps.version.outputs.short_sha }}\`, versionCode \`${{ github.run_number }}\`.
          EOF

      # `26-26`: `agoReleaseVersion` is a hand-bumped literal, not incremented on every push, so more
      # than one push to `main` can carry the same version — and `gh release create` fails outright
      # (HTTP 422, "Release.tag_name already exists") on a tag that already has a release, rather
      # than updating it. Checking `gh release view`'s exit code — not its output, which would look
      # the same for "no release" as for a release whose body happens to be short — is what tells a
      # repeat push under an unbumped version apart from that version's first push. `--cleanup-tag`
      # removes the underlying git tag along with the release object, so a repeat push always starts
      # the create step below from a genuinely clean slate instead of layering a new release onto an
      # old tag ref. Proven against a real (throwaway, since deleted) tag on this repository before
      # this item was called done: create → second create fails with exactly that 422 → delete
      # --cleanup-tag → view fails (tag gone) → create again succeeds with fresh content.
      - name: Delete existing release for this version, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}"
          fi

      # `gh release create`, not `softprops/action-gh-release`: the CLI is preinstalled on
      # `ubuntu-latest` and already authenticates with `GITHUB_TOKEN`, so this is one fewer
      # third-party action in the supply chain for the same result — the same reasoning
      # `publish-images` (ago-console) gives for `docker login` over `docker/login-action`.
      # `--prerelease`: `docs/backlog/26-09-*.md` calls for a pre-release, not a release — this is
      # a per-commit testing build, not a versioned product release. `--target` pins the release to
      # this exact commit regardless of where `main` has moved by the time this step runs.
      #
      # `26-26`: the tag and title now name the product version (`v<semver>` / `Release v<semver>`),
      # not the commit — `26-24`'s own reasoning here used to be that a version-named tag would
      # collide on a second push sharing the same hand-set version, which is exactly the case the
      # delete-existing step above now handles by updating the release in place instead of failing.
      # The commit is still fully traceable without a commit-named tag: `versionName` itself
      # (`26-24`, untouched by this item) already carries `<semver>+<short sha>` inside the APK's own
      # manifest, and the notes below repeat it — "which commit" was never this tag's only job, and
      # naming it after the version instead is what makes the release page readable as "which product
      # version is this" without decoding a sha first.
      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          url=$(gh release create "$tag" \
            "${{ steps.version.outputs.apk }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Release v${{ steps.version.outputs.release_version }}" \
            --notes-file release-notes.md \
            --prerelease)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise what was published
        run: |
          {
            echo "### Release APK published"
