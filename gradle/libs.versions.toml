# Version catalog — the single place a version is declared.
#
# Every module reads from here (`libs.foo`), never from a version string typed at the call site.
# This is this repository's equivalent of the backend's `Directory.Packages.props`
# (`ago-root/docs/backlog/26-07-*.md`, Scope).

[versions]
# Android / Kotlin toolchain — `25-214`, a *coordinated* bump, because these rows are not
# independently bumpable and Dependabot files them as if they were. Two couplings, stated here so
# the next per-dependency PR that hits one is recognised on sight rather than re-diagnosed from a
# CI log (`ago-root/docs/backlog/25-214-*.md`):
#
#   AGP -> Gradle wrapper -> compileSdk. AGP 9.4's own compatibility table names Gradle 9.6.0 as
#   both its minimum and its default, JDK 17, SDK Build Tools 36.0.0, and API 37 as the highest
#   compileSdk it supports. `gradle/wrapper/gradle-wrapper.properties` therefore moves with this
#   row (9.7.1, the current stable 9.x, not the bare 9.6.0 minimum), and `compileSdk` in
#   `app/build.gradle.kts` and `core/network/build.gradle.kts` moves with it too — androidx's own
#   current releases (`coreKtx`, `composeBom` below) refuse to link against anything lower.
#
#   Kotlin -> KSP. See the `ksp` row below: the shape of that coupling changed with KSP 2.3.
#
# 9.4.1 is the newest stable AGP on Google's Maven (9.5.x is alpha-only), 2.4.20 the newest stable
# Kotlin — the same "newest stable of the generation, not a preview" rule every other row here
# states for itself.
agp = "9.4.1"
kotlin = "2.4.20"
# The JDK toolchain, pinned once here and read by every module's `jvmToolchain(...)` call rather
# than re-typed per build file or left to whatever JDK happens to be on the machine running the
# build (`26-07`'s own Scope: "a JDK toolchain pinned once").
jdk = "17"

# Compose BOM pins every androidx.compose.* artifact to one mutually-tested set. The 2024.10.01
# entry this replaces warned that "a newer BOM's minimum Kotlin/compileSdk requirement is not
# guaranteed to hold against the toolchain actually pinned here" — `25-214` is that caveat coming
# true and being paid off rather than worked around: 2026.09.00 pulls
# `androidx.compose.ui:ui-android` 1.12.x, which needs AGP >= 9.1.0 and `compileSdk` >= 37, which
# is exactly the triangle the `agp` row above now moves as one piece.
composeBom = "2026.09.00"

# Same wall as the Compose BOM: `core-ktx` 1.19.0 is compiled against `compileSdk` 37 and refuses
# to link under AGP 8.x. It is in this bump for that reason, not because it was due.
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.9.2"

junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
espressoCore = "3.6.1"

# `26-12`: KSP is the annotation processor Hilt and Room run under (kapt is the alternative and is
# strictly slower — Dagger/Hilt has supported KSP since 2.48 and recommends it).
#
# `25-214`: this row's coupling to `kotlin` above changed shape, and that is worth stating because
# the old shape is what a stale memory will reach for. Through KSP 1.x/2.0.x the version string was
# a *pair* — `<kotlin version>-<ksp release>`, e.g. the `2.0.21-1.0.28` this replaces — so bumping
# `kotlin` alone left `ksp` pointing at a coordinate that does not exist and the build failed with
# `Plugin [id: 'com.google.devtools.ksp', version: '...'] was not found`. From KSP 2.3.0 onward
# (the last paired release published is `2.2.21-2.0.5`) KSP2 versions independently, plain
# semver — so this row no longer has to be retyped every time `kotlin` moves. It is still not
# *unrelated* to it: KSP still runs inside the Kotlin compiler, so a KSP release predating a Kotlin
# release is the thing to suspect first if annotation processing breaks after a `kotlin` bump.
# 2.3.12 is the newest KSP release.
ksp = "2.3.12"

# `26-12`: dependency injection. `docs/architecture.md`'s "Module layout" names Hilt as the author's
# own 2026-09-21 decision, and `26-07` deferred wiring it for lack of anything to inject.
#
# `25-214`: this row is a third member of the `agp` coupling above, discovered the hard way rather
# than predicted — Hilt's *Gradle plugin* reads AGP's legacy `BaseExtension`, which AGP 9 no longer
# creates, so 2.52 fails at configuration time with "Android BaseExtension not found" the moment
# `agp` crosses 8.x. Hilt added AGP 9 support in 2.59; 2.60.1 is the newest release and the one
# taken, since the intermediate 2.59.x had its own AGP 9 follow-up fixes.
hilt = "2.60.1"
# `26-14`: `hiltViewModel()` inside a plain `@Composable` — `ConversationListRoute`'s own way of
# obtaining `ConversationListViewModel` with no Navigation Compose graph yet to hang a destination off
# (`docs/architecture.md`: Navigation Compose itself arrives with `26-16`). 1.2.0 was picked as the
# release generation targeting this project's own Compose BOM.
#
# `25-214` moved `composeBom` well past that generation and deliberately left this row where it is:
# unlike `hilt` and `room` above, nothing here *breaks* — it compiles, and `26-16`'s own instrumented
# navigation tests pass on a device against the new BOM. A bump for its own sake is a separate
# promise from clearing the AGP wall, so it is not in this item. The sentence above is kept, with
# this correction attached, rather than rewritten to pretend the generations still line up.
hiltNavigationCompose = "1.2.0"

# `26-16`: Navigation Compose, arriving with its first real consumer — the bottom navigation and the
# back-button contract this item owns (`docs/architecture.md`/`SignInUiState`'s own doc comment: "arrives
# with 26-16"). 2.8.3 is the release generation contemporary with `hiltNavigationCompose` 1.2.0 — and,
# at the time it was chosen, with this project's own Compose BOM. `25-214` moved the BOM and left this
# row alone for the same reason it left `hiltNavigationCompose` alone; see that row.
navigationCompose = "2.8.3"

# `26-12`: the HTTP client, per `docs/architecture.md`'s stack table (Ktor over Retrofit, because it
# is multiplatform and so keeps `adr/0178`'s KMP door open at no cost). 2.3.12 is the last 2.3.x and
# the generation built against Kotlin 2.0.x; Ktor 3.x exists but changes API this repository has no
# reason to chase on its first HTTP call.
ktor = "2.3.12"
kotlinxSerializationJson = "1.7.3"
kotlinxCoroutines = "1.8.1"

# `26-12`: AppAuth for Android — Authorization Code + PKCE in a Custom Tab, never an embedded
# WebView (`docs/architecture.md`, Identity; `26-11` created the `ago-android` realm client it talks
# to). 0.11.1 is the current release of the OpenID Foundation's own certified library.
appauth = "0.11.1"

# `26-12`: `EncryptedSharedPreferences` for the tokens. 1.1.0-alpha06 rather than the 1.0.0 "stable"
# deliberately: 1.0.0's only key helper is `MasterKeys`, which is *deprecated*, and this project
# builds with `allWarningsAsErrors` — a deprecated API is a build failure here, not a warning.
# 1.1.0-alpha06 is the release that introduced the replacement (`MasterKey.Builder`) and is the one
# Google's own current documentation samples.
securityCrypto = "1.1.0-alpha06"


# `26-08`: the format gate. This is a build-time Gradle plugin wrapping the `ktlint` CLI, not a
# hand-rolled formatter — the same "behind a well-known port, don't hand-roll it" reasoning as
# every other row in `ago-android/docs/architecture.md`'s stack table. Deliberately not detekt
# (`docs/backlog/26-08-*.md`'s own Scope: Android Lint plus `allWarningsAsErrors` already cover
# this project's actual needs; detekt is a second suppression vocabulary for findings nobody has
# had yet).
#
# `25-214`: a fourth member of the `agp` coupling, and the nastiest, because it failed *green*.
# 12.1.1 discovers the Kotlin source sets it lints by reacting to the `org.jetbrains.kotlin.android`
# plugin — which AGP 9's built-in Kotlin makes it illegal to apply. With that plugin gone, 12.1.1
# registered no `runKtlintCheckOverMainSourceSet`/`...TestSourceSet` task in `:app` or
# `:core:network` at all: `./gradlew ktlintCheck` still passed, having checked nothing but the two
# `.gradle.kts` files. 14.2.0 is the newest release and knows about AGP's built-in Kotlin; the
# source-set tasks are back in all three modules, which is the property to re-check by name (not by
# exit code) if this row ever moves again.
ktlintGradle = "14.2.0"

# `26-13`: Microsoft's official Java SignalR client (`docs/architecture.md`'s stack table;
# `adr/0178` — chosen despite being JVM-only, a closed decision, not reopened here). 9.0.5 is a
# current stable release on Maven Central; it targets a Java 8 bytecode level, well under this
# project's `minSdk = 26` floor. It depends on RxJava 3.0.11 transitively for its own
# `Single`/`Completable`-shaped async surface (`start()`, `stop()`, `invoke()`,
# `withAccessTokenProvider`) — this catalog pins a current, binary-compatible 3.x patch explicitly
# below rather than leaving the version an unstated transitive detail, since `:core:network` code
# calls these RxJava types directly at the one seam where this client's async shape meets Kotlin
# coroutines.
signalr = "9.0.5"
rxjava3 = "3.1.9"

# `26-14`: Room, arriving with its first real consumer (the conversation list's stale-until-proven-fresh
# cache, `docs/architecture.md` "Offline").
#
# `25-214`: 2.6.1 was pinned here precisely *because* it was "the last release built and tested
# against" the Kotlin 2.0.21 / KSP 2.0.21-1.0.28 generation — so when that generation moved, this row
# had to move with it. Room's annotation processor is the KSP processor, and 2.6.1 predates KSP2
# entirely: under KSP 2.3.x it dies in `kspDebugKotlin` with
# `java.lang.IllegalStateException: unexpected jvm signature V`, which is a processor-internals
# failure, not anything wrong with this project's own `@Dao`s. 2.8.5 is the newest release and the
# first line with real KSP2 support. Nothing in this project's Room usage changed: the
# `RoomDatabase`/`@Dao`/`Room.databaseBuilder` surface 2.6 exposed is unchanged, and the
# SQLite-driver rewrite 2.7 introduced is opt-in.
room = "2.8.5"

# `26-17`: the Тема preference's own store. Not Room (`26-14`'s row above already states why Room's own
# instrumented-test-only proof of real persistence is a genuine limitation, not a preference) and not
# plain `SharedPreferences` (`docs/architecture.md`'s stack table names it as what Room replaces, and it
# cannot be observed as a `Flow` without a hand-rolled `OnSharedPreferenceChangeListener` adapter, nor
# proven to persist on a plain JVM `test` without Robolectric — `26-08` already declined that dependency).
# `datastore-preferences` is the smallest library that gives an observable `Flow` for free (what makes
# "applied immediately" trivial) *and* is provably testable on plain JVM with a real temp file and no
# Android `Context` at all, since `PreferenceDataStoreFactory.create` only ever needs a `java.io.File` —
# `DataStoreThemePreferencesTest` is that real, on-disk proof, not a fake standing in for one. 1.1.7 is
# the newest stable release, contemporary with this catalog's other `25-214`-generation rows.
datastore = "1.1.7"

# `26-06`/`adr/0180`: RuStore Push, not FCM (`docs/adr/0180`, `docs/architecture/push-notifications.md`).
# 7.5.0 is the `<release>`/`<latest>` in `maven-metadata.xml` at
# `nexus-external.rustore.ru/repository/maven-rustore-exposed/ru/rustore/sdk/pushclient/`, read
# 2026-09-24 — newer than the 7.4.0 the backlog item recorded three days earlier on 2026-09-21, which
# is itself the reason this is read from the metadata rather than copied from that item file.
rustorePushClient = "7.5.0"

# `26-06`: the periodic re-registration job (`docs/architecture.md`'s own "Push" section states the
# interval and why). Not on the `lifecycleRuntimeKtx`/`26-07` generation because WorkManager versions
# independently of it; 2.10.1 is the newest stable release compatible with this project's `minSdk = 26`
# / `compileSdk = 37`.
work = "2.10.1"

# `26-100`/`adr/0181`: FCM, the primary push transport now - RuStore (`rustorePushClient` above) stays
# the fallback. Pinned directly rather than through the Firebase BoM: this app has no other Firebase
# artifact to keep mutually consistent with it, and every other row in this catalog is already a single
# pinned version rather than a BoM-managed set (the `composeBom` row above is the one deliberate
# exception, for a library family this project actually spans several of). 25.1.3 is the `<release>` in
# `dl.google.com/android/maven2/com/google/firebase/firebase-messaging/maven-metadata.xml`, read
# 2026-09-25.
firebaseMessaging = "25.1.3"

# `26-100`: `GoogleApiAvailability`/`ConnectionResult` - `TransportSelector`'s own per-device check for
# whether FCM's distributor (Google Play Services) is actually usable here, and `FcmPushGateway`'s own
# `checkAvailability()`. 18.11.0 is the `<release>` in
# `dl.google.com/android/maven2/com/google/android/gms/play-services-base/maven-metadata.xml`, read
# 2026-09-25.
playServicesBase = "18.11.0"

# `26-191`/`C4` (`docs/design/tenant-channels-android.md` §3.5): the Каналы → Почта logo preview - the
# app's first remote image, and its one call site (`BrandingScreen`'s own `AsyncImage`). The alternative
# is hand-rolling a bytes-fetch + `BitmapFactory` + a `remember`ed painter with its own lifecycle,
# cancellation and caching - reinventing what Coil already is, worse; that doc section's own
# "justification (required by the no-package rule)" is the standing record for this bump. 3.6.3 is the
# `<release>`/`<latest>` in `repo1.maven.org/maven2/io/coil-kt/coil3/coil-compose/maven-metadata.xml`,
# read 2026-09-26.
coil = "3.6.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# `26-13`: `ProcessLifecycleOwner` - the single, whole-app foreground/background signal
# `OperatorHubConnectionLifecycle` binds `connect()`/`disconnect()` to (`docs/architecture.md`
# §Realtime: "Lifecycle tied to the app being in the foreground"), rather than each `Activity`'s own
# `onStart`/`onStop`, which this app has exactly one of today but which would still be the wrong
# signal even with several: a rotation tears an `Activity` down and rebuilds it, and its `onStop`
# firing on the way out must not read as "the app left the foreground". Same version generation as
# `lifecycleRuntimeKtx` above.
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
# `26-14`: the Compose-aware half of the same `lifecycleRuntimeKtx` generation —
# `androidx.lifecycle.compose.LocalLifecycleOwner` (the non-deprecated home for it, unlike the older
# copy in `androidx.compose.ui:ui`, which this project's `allWarningsAsErrors` would turn into a build
# failure) and `collectAsStateWithLifecycle()`, which `ConversationListRoute` uses so its own
# `StateFlow` collection pauses outside `RESUMED` rather than running while backgrounded.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# `26-13`: the one, already-reviewed bridge between a `suspend` function and the `Single`/`Completable`
# shape `com.microsoft.signalr`'s own client exposes - `rxSingle`/`.await()` below, standing in for a
# hand-rolled `suspendCancellableCoroutine` wrapper around each Rx type this client returns. Same
# version generation as the rest of this project's coroutines.
kotlinx-coroutines-rx3 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-rx3", version.ref = "kotlinxCoroutines" }

signalr = { group = "com.microsoft.signalr", name = "signalr", version.ref = "signalr" }
rxjava3 = { group = "io.reactivex.rxjava3", name = "rxjava", version.ref = "rxjava3" }

# `26-14`: Room. `-ktx` for `suspend`-function DAOs (this project's own coroutines-everywhere
# convention); `-compiler` runs through KSP, the same choice `26-12` already made for Hilt and for the
# identical reason (Dagger/Room both support it, and it is the faster of the two annotation-processing
# paths). `-testing` backs the one instrumented test this item's own cache needs — Room's in-memory
# database is real SQLite, which the plain JVM `test` source set cannot provide without Robolectric, a
# dependency `26-08` already declined to add for a different reason (a second suppression vocabulary);
# an `androidTest` against the emulator is what this project already has instead.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# `26-17`: the Тема preference's store — see the `datastore` version row above for why this, and not
# Room or plain `SharedPreferences`.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# `26-06`: RuStore Push client — see the `rustorePushClient` version row above.
rustore-pushclient = { group = "ru.rustore.sdk", name = "pushclient", version.ref = "rustorePushClient" }

# `26-06`: the periodic device re-registration job — see the `work` version row above. `-ktx` for the
# `suspend`-function `CoroutineWorker` this project's own coroutines-everywhere convention expects (the
# same `-ktx`-for-suspend choice `androidx-room-ktx` above already makes).
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# `26-06`: `TestListenableWorkerBuilder` — the real, documented way to build and run a `CoroutineWorker`
# in a plain JVM `test` with no `WorkManager` runtime behind it, the same "test the unit, not the
# scheduler" split `androidx-room-testing` draws for Room's own instrumented half (`work`'s own version
# row above; `docs/backlog/26-06-*.md` names the `advanceUntilIdle()`-spins-forever trap a periodic-work
# test can fall into, which testing the worker's `doWork()` directly and the `WorkRequest`'s own built
# constraints separately both avoid).
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# `26-100`/`adr/0181`: FCM — see the `firebaseMessaging` version row above. No `com.google.gms.google-
# services` plugin/BoM: `FirebaseApp.initializeApp` is called manually from `BuildConfig` fields
# (`AgoChatApplication`'s own doc comment), so no `google-services.json` is ever committed to this
# public repo.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
# `26-100`: `GoogleApiAvailability` — see the `playServicesBase` version row above.
play-services-base = { group = "com.google.android.gms", name = "play-services-base", version.ref = "playServicesBase" }

# `26-191`/`C4`: Coil 3 — see the `coil` version row above. `-compose` for `AsyncImage`; `-network-okhttp`
# so it fetches over this app's own OkHttp engine rather than pulling in a second HTTP stack.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

